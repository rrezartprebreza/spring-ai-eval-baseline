name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run evals (replay mode, no model calls)
        id: verify
        continue-on-error: true
        run: mvn -B verify

      - name: Check release packaging (sources and javadoc, no signing)
        if: steps.verify.outcome == 'success'
        run: mvn -B -Prelease -Dgpg.skip -DskipTests package

      - name: Collect eval reports
        if: always()
        run: |
          {
            echo "## Eval report"
            echo
            for f in $(find . -path '*/target/eval-reports/*.md' | sort); do cat "$f"; echo; done
          } > eval-report.md
          cat eval-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post report on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- eval-baseline-report -->';
            const body = marker + '\n' + fs.readFileSync('eval-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body && c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if the build failed
        if: steps.verify.outcome != 'success'
        run: exit 1
